version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ekvator_db
    environment:
      POSTGRES_DB: ekvator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: ekvator_app
    depends_on:
      - db
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ekvator
    ports:
      - '3000:3000'
    command: sh -c "npm install && npm run build && npm run start:prod"

volumes:
  db_data:
